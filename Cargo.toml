[package]
name = "slapp"
version = "0.1.3"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/RazorBest/slapp-rs"
homepage = "https://github.com/RazorBest/slapp-rs"
description = "A framework for developing MitM at the application layer"


[lib]
name = "slapp"
path = "src/lib.rs"

[dependencies]
bytes = "1.12.1"
nfq = { package = "nfq-razor-temp-release", version = "0.2.6" }
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
etherparse = "0.19.0"
pcap-file = "2.0.0"
